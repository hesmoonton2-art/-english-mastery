name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Export static web build
        env:
          CAPACITOR_BUILD: "1"
        run: |
          npm run build
          npx cap sync android

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect and verify APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/english-mastery-debug.apk
          ls -lh release
          # Fail the job loudly if the APK is suspiciously small or missing key entries.
          SIZE=$(stat -c%s release/english-mastery-debug.apk)
          if [ "$SIZE" -lt 1000000 ]; then echo "APK looks too small ($SIZE bytes)"; exit 1; fi
          unzip -l release/english-mastery-debug.apk | grep -q "classes.dex" || { echo "classes.dex missing"; exit 1; }
          unzip -l release/english-mastery-debug.apk | grep -q "assets/public/index.html" || { echo "web assets missing"; exit 1; }
          unzip -l release/english-mastery-debug.apk | grep -q "AndroidManifest.xml" || { echo "manifest missing"; exit 1; }
          echo "APK verified: $SIZE bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-mastery-apk
          path: release/english-mastery-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the apk-build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/english-mastery-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to publish"
          else
            git commit -m "build: Android APK $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          # Publish as a dedicated branch so the source branch history stays clean.
          git push origin HEAD:refs/heads/apk-build
